name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check (types & content)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify blog artifact
        run: npm run verify:blog

      - name: Build & verify with draft posts
        run: BLOG_INCLUDE_DRAFTS=1 npm run build && BLOG_INCLUDE_DRAFTS=1 npm run verify:blog
